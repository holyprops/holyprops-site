<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Επικοινωνία — Holy Props</title>
  <meta name="description" content="Επικοινώνησε με τη Holy Props για props, ειδικές κατασκευές και χειροτεχνία.">
  <link rel="icon" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Mali:wght@700&family=Noto+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav wrap">
      <a class="logo" href="index.html"><img src="img/logo-small.png" alt=""><span class="brand">H<span class="halo-o">o</span>ly Props</span></a>
      <button class="menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
      <ul>
        <li><a href="index.html" data-i18n="nav_home">Αρχική</a></li>
        <li><a href="kataskeves.html" data-i18n="nav_work">Κατασκευές</a></li>
        <li><a href="epikoinonia.html" aria-current="page" data-i18n="nav_contact">Επικοινωνία</a></li>
        <li><button class="lang" id="lang">EN</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <div class="wrap">
        <div class="section-head">
          <h1 data-i18n="contact_title">Επικοινωνία</h1>
          <p data-i18n="contact_lead"></p>
        </div>
        <div class="contact-grid">
          <!-- Φόρμα: στέλνει στο Google script (js/main.js, FORM_URL) → email στο info@holyprops.gr + Google Sheet -->
          <form id="contact-form" name="contact" method="POST" novalidate>
            <p hidden><label>Μην το συμπληρώσεις: <input name="company"></label></p>
            <div class="row">
              <div><label for="name" data-i18n="f_name">Όνομα</label><input id="name" name="name" autocomplete="name" required></div>
              <div><label for="email" data-i18n="f_email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
            </div>
            <div class="row">
              <div><label for="phone" data-i18n="f_phone"></label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
              <div>
                <label for="type" data-i18n="f_type"></label>
                <select id="type" name="type">
                  <option value="props" data-i18n="f_type_props">Props</option>
                  <option value="special" data-i18n="f_type_special"></option>
                  <option value="craft" data-i18n="f_type_craft"></option>
                  <option value="other" data-i18n="f_type_other"></option>
                </select>
              </div>
            </div>
            <label for="message" data-i18n="f_msg">Μήνυμα</label>
            <textarea id="message" name="message" required data-i18n-ph="f_msg_ph"></textarea>
            <div class="actions"><button class="btn" type="submit" data-i18n="f_send">Αποστολή</button></div>
            <div class="form-msg" id="form-msg" role="status"></div>
          </form>

          <div class="info">
            <h3 data-i18n="info_title">Στοιχεία</h3>
            <p><strong data-i18n="info_email">Email</strong><a href="mailto:info@holyprops.gr">info@holyprops.gr</a></p>
            <p><strong data-i18n="info_phone">Τηλέφωνο</strong><a href="tel:+306934111334">+30 693 411 1334</a></p>
            <p><strong data-i18n="info_social">Instagram</strong><a href="https://www.instagram.com/holyprops/" target="_blank" rel="noopener">@holyprops</a></p>
            <p><strong data-i18n="info_area">Περιοχή</strong><span data-i18n="info_area_v">Αθήνα</span></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <img src="img/logo-small.png" alt="">
    <div><span class="brand">H<span class="halo-o">o</span>ly Props</span> · <span data-i18n="footer"></span></div>
    <div><a href="mailto:info@holyprops.gr">info@holyprops.gr</a> · <a href="tel:+306934111334">+30 693 411 1334</a> · <a href="https://www.instagram.com/holyprops/" target="_blank" rel="noopener">Instagram</a></div>
    <div>© 2026 · <span data-i18n="info_area_v">Αθήνα</span></div>
  </footer>

  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
